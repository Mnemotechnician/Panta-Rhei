- type: entity
  id: BaseLeash
  parent: BaseItem
  name: leash
  description: Helps keep your animals or friends close to you. Attach to supported objects or clothing (such as collars) to use. You can pull attached entities while holding the leash.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Floof/Objects/Tools/leash.rsi
    layers:
    - state: icon
    scale: 0.7, 0.7
  - type: Leash
    pullInterval: 0.75
    leashSprite:
      sprite: _Floof/Objects/Tools/leash-rope.rsi
      state: rope
  - type: Anchorable
    delay: 3
    snap: false # The first ever entity to set this field to false! However, this doesn't seem to work :c

- type: entity
  id: LeashBasic
  parent: BaseLeash
  components:
  - type: Leash
    length: 0.5
    lengthConfigs: &leashConfigs [0.1, 0.2, 0.3]
    maxDistance: 60
    attachDelay: 4
    detachDelay: 4
    selfDetachDelay: 10

- type: entity
  id: LeashAdvanced
  parent: LeashBasic
  name: advanced leash
  components:
  - type: Leash
    lengthConfigs: *leashConfigs
    maxJoints: 2
    attachDelay: 2.5
    detachDelay: 2
    selfDetachDelay: 15

- type: entity
  id: LeashBluespace
  parent: BaseLeash
  name: bluespace leash
  description: Powered by a miniature singularity inside the handle. Not safe for use by crewmembers.
  suffix: DEBUG, DO NOT MAP
  components:
  - type: Leash
    lengthConfigs: [1, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10]
    maxDistance: 20
    maxJoints: 10
    attachDelay: 2.5
    detachDelay: 5
    selfDetachDelay: 20
    pullInterval: 0.1


# Leash link
- type: entity
  id: LeashLink
  name: leash link
  description: YOU SHOULD NOT SEE THIS
  components:
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.1
          position: 0,0
        density: 20
        mask:
        - Leash
        - ItemMask
        layer:
        - Leash
        restitution: 0.3
        friction: 0.2
